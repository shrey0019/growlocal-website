services:
  - type: web
    name: growlocal
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: growlocal-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://growlocal.onrender.com
