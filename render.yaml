# One-click Render blueprint (free tier).
# Note: free tier has no persistent disk, so the SQLite DB resets on
# redeploy/restart and re-seeds the demo data automatically. Fine for
# demo/QC. For production persistence, add a paid disk mounted at
# /opt/render/project/src/data (see README > Deploy).
services:
  - type: web
    name: growlocal
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://growlocal.onrender.com
